{% set name = "neutralocean" %}
{% set version = "2.5.1" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/neutralocean-{{ version }}.tar.gz
  sha256: e3b5b4240b627a0f2167d8bcecacd2ed9e022bf2d88300523f1782cb8ceca354

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=69
    - wheel
  run:
    - python >={{ python_min }}
    - numba
    - numpy
    - xarray
    - scipy
    - xgcm

test:
  imports:
    - neutralocean
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/geoffstanley/neutralocean
  summary: Neutral Surfaces in the Ocean
  license: MIT
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - geoffstanley
